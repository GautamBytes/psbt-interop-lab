name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:validators
      - run: pnpm check:conformance-data
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js self-test
      - run: npm ci --prefix examples/wallet-ci-adapter --ignore-scripts
      - run: npm test --prefix examples/wallet-ci-adapter
      - run: node dist/cli.js adapter check examples/wallet-ci-adapter/adapter-manifest.json

  website:
    name: Website / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  rust-adapter:
    name: Rust adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/rust-bitcoin
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  bdk-wallet-current-adapter:
    name: Current BDK Wallet adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/bdk-wallet-current
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  psbt-v2-adapter:
    name: PSBTv2 adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/rust-psbt-v2
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  musig2-adapter:
    name: Rust MuSig2 adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/musig2-rust
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  musig2-scure-adapter:
    name: Scure MuSig2 adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/musig2-scure
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm audit --omit=dev

  libwally-adapter:
    name: libwally 1.5.4 adapter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - run: docker build --tag psbt-interop-lab/libwally:1.5.4 adapters/libwally-1.5.4

  package-smoke:
    name: Release tarball smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: mkdir -p /tmp/psbt-package /tmp/psbt-install
      - run: npm pack --ignore-scripts --pack-destination /tmp/psbt-package
      - run: npm install --prefix /tmp/psbt-install /tmp/psbt-package/psbt-interop-lab-*.tgz --ignore-scripts
      - run: test ! -d /tmp/psbt-install/node_modules/ajv
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab self-test
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab adapter --help
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab fuzz --help
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab history --help
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab adapter init /tmp/psbt-generated-adapter --name package-smoke
      - run: npm install --prefix /tmp/psbt-generated-adapter /tmp/psbt-package/psbt-interop-lab-0.10.1.tgz --save-dev --ignore-scripts
      - run: npm ci --prefix /tmp/psbt-generated-adapter --ignore-scripts
      - run: npm test --prefix /tmp/psbt-generated-adapter
      - run: /tmp/psbt-install/node_modules/.bin/psbt-lab adapter check /tmp/psbt-generated-adapter/adapter-manifest.json
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/compose.yaml
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/templates/typescript/package.json.tmpl
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/adapters/rust-bitcoin/Dockerfile
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/adapters/libwally-1.5.4/Dockerfile
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/adapters/musig2-rust/Dockerfile
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/adapters/musig2-scure/Dockerfile
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/adapters/hwi-simulator/Dockerfile
      - run: test -f /tmp/psbt-install/node_modules/psbt-interop-lab/dist/conformance/adapter-manifest.schema.json

  go-adapter:
    name: btcsuite Go adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/btcsuite-go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: adapters/btcsuite-go/go.sum
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  bitcoinjs-adapter:
    name: bitcoinjs-lib adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/bitcoinjs-lib
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/bitcoinjs-lib/package-lock.json
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck

  hwi-simulator-adapter:
    name: HWI simulator adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/hwi-simulator
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: adapters/hwi-simulator/package-lock.json
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck

  bdk-adapter:
    name: Frozen BDK Python adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/bdkpython-2.3.1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64
      - run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r requirements.txt
      - run: python -m unittest -v test_adapter.py

  feature-docker-proof:
    name: v0.10 feature Docker proof
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm ci --prefix examples/wallet-ci-adapter --ignore-scripts
      - run: mkdir -p /tmp/psbt-package
      - run: npm pack --ignore-scripts --pack-destination /tmp/psbt-package
      - name: Exercise wallet CI action from the release tarball
        uses: ./
        with:
          adapter-manifest: examples/wallet-ci-adapter/adapter-manifest.json
          package-spec: /tmp/psbt-package/psbt-interop-lab-0.10.1.tgz
          artifacts: artifacts/external-wallet
          junit: artifacts/external-wallet.xml
          sarif: artifacts/external-wallet.sarif
      - run: node dist/cli.js run --category taproot-scriptpath
      - run: node dist/cli.js run --category taproot-conformance
      - run: node dist/cli.js run --category psbtv2-interop
      - run: node dist/cli.js run --category psbtv2-constructor --no-build
      - run: node dist/cli.js run --category psbtv2-taproot --no-build
      - run: node dist/cli.js run --scenario bip375-advanced-sender-workflows-rust-psbt-v2
      - run: node dist/cli.js run --category musig2
      - run: node dist/cli.js run --category hardware-signing
      - if: always()
        run: docker compose stop core

  docker-proof:
    name: Complete Docker proof
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm proof
      - name: Upload redacted compatibility reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: psbt-interop-reports
          path: |
            artifacts/*/report.json
            artifacts/*/report.md
            artifacts/*/report.html
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose stop core
