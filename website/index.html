<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find PSBT interoperability failures across real Bitcoin libraries with deterministic, replayable tests."
    />
    <meta name="theme-color" content="#07090b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PSBT Interop Lab" />

      property="og:description"
      content="Find PSBT interoperability failures across real Bitcoin libraries with deterministic, replayable tests."

      property="og:image"

    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        const stored = window.localStorage.getItem("psbt-lab-theme");
        const theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia?.("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" href="/hero-protocol-map.png" type="image/png" />
    <title>PSBT Interop Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
